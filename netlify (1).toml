[build]
  base    = "alhamra-module1/textile-admin"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # These two are public by design (Next.js puts NEXT_PUBLIC_* values in the browser code).
  # The secret SUPABASE_SERVICE_ROLE_KEY is still scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_URL"
